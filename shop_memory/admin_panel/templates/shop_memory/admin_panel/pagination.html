{% if page_obj.paginator.num_pages > 1 %}<div class="pagination"><span>صفحه {{ page_obj.number }} از {{ page_obj.paginator.num_pages }}</span><div>{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}&q={{ q|urlencode }}&level={{ level|urlencode }}&status={{ status|urlencode }}">قبلی</a>{% endif %}{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}&q={{ q|urlencode }}&level={{ level|urlencode }}&status={{ status|urlencode }}">بعدی</a>{% endif %}</div></div>{% endif %}
